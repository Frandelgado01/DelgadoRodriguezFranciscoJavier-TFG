# Pipeline de integración continua (plan, R13). Se amplía en cada tarea que añade una comprobación.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Mismas imágenes que compose.yaml, para las pruebas de integración (T-06). Las credenciales son solo
    # de este contenedor efímero del CI.
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: cuaderno
          POSTGRES_USER: cuaderno
          POSTGRES_PASSWORD: cuaderno-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuaderno -d cuaderno"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      URL_BASE_DATOS: postgresql+psycopg://cuaderno:cuaderno-ci@127.0.0.1:5432/cuaderno
      URL_PUBLICA: https://localhost
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      CORREO_REMITENTE: cuaderno@localhost
      URL_MAILPIT: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Instalar dependencias desde uv.lock
        run: uv sync --locked
      - name: Lint (ruff, con las reglas S de seguridad)
        run: uv run ruff check .
      - name: Formato (ruff)
        run: uv run ruff format --check .
      - name: Tipos (mypy estricto)
        run: uv run mypy
      # pip-audit no lee uv.lock ni filtra por severidad: se exporta el bloqueo con hashes y falla con
      # cualquier vulnerabilidad conocida (más estricto que "alta o crítica"; research R13).
      - name: Dependencias (pip-audit sobre uv.lock)
        run: |
          uv export --format requirements.txt --locked --no-emit-project --output-file "$RUNNER_TEMP/requisitos.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requisitos.txt" --require-hashes --disable-pip --strict
      - name: Pruebas
        run: uv run pytest

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias desde package-lock.json
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (tsc estricto)
        run: npm run typecheck
      - name: Dependencias (npm audit, falla con altas o críticas)
        run: npm run audit
      - name: Pruebas
        run: npm test
