  - id: F27
    conjunto: final
    pregunta: "¿Cuánto pasto hay que dejar sin segar para las islas de biodiversidad?"
    respuesta_esperada: "El 4 % del conjunto de los pastos permanentes y temporales que se siegan."
    esperado:
      - norma: "RD 1048/2022"
        unidad: "artículo 31"
        apartado: "3"
        extracto: "del 4 % del conjunto de la superficie de pastos permanentes y pastos temporales objeto de siega"
    revisada: true
  - id: F28
    conjunto: final
    pregunta: "Según Europa, ¿sirve escanear el cuaderno o el registro tiene que poder leerlo una máquina?"
    respuesta_esperada: "Tiene que ser electrónico y legible por máquina."
    esperado:
      - norma: "Reglamento (UE) 2023/564"
        unidad: "artículo 2"
        apartado: null
        extracto: "utilizando un formato legible por máquina"
    revisada: true
  - id: F29
    conjunto: final
    pregunta: "En zona vulnerable, ¿cuántas horas puedo tener el estiércol amontonado junto a la parcela?"
