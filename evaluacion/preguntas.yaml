preguntas:
  - id: A01
    conjunto: ajuste
    pregunta: "¿Puedo dejar el atomizador al raso?"
    respuesta_esperada: "No: resguardado de la lluvia."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 39"
        apartado: "c"
        extracto: "Los equipos de tratamiento se guardarán resguardados de la lluvia"
    revisada: true
  - id: A02
    conjunto: ajuste
    pregunta: "¿Me venden fitosanitarios profesionales si no tengo carné?"
    respuesta_esperada: "No."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 21"
        apartado: "1"
        extracto: "sólo podrán suministrarse productos fitosanitarios para uso profesional a titulares de un carné"
    revisada: true
  - id: A03
    conjunto: ajuste
    pregunta: "Vivo en Castilla-La Mancha, ¿dónde pido el carné?"
    respuesta_esperada: "En la comunidad autónoma donde se reside."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 20"
        apartado: "1"
        extracto: "que deberá realizar el interesado en la comunidad autónoma donde resida"
    revisada: true
  - id: A04
    conjunto: ajuste
    pregunta: "¿El cuarto de los productos puede dar a un patio interior?"
    respuesta_esperada: "No: la ventilación da al exterior."
    esperado:
      - norma: "RD 285/2021"
        unidad: "artículo 4"
        apartado: "2.b"
        extracto: "en ningún caso a patios o galerías de servicio interiores"
    revisada: true
  - id: A05
    conjunto: ajuste
    pregunta: "¿Puedo tener en la nave productos caducados?"
    respuesta_esperada: "No se pueden almacenar; se gestionan como residuos."
    esperado:
      - norma: "RD 285/2021"
        unidad: "artículo 4"
        apartado: "1"
        extracto: "productos fitosanitarios cuya fecha de caducidad haya expirado"
    revisada: true
  - id: A06
    conjunto: ajuste
    pregunta: "Tengo un huerto para comer en casa, ¿me afecta la norma del abonado?"
    respuesta_esperada: "No, salvo las obligaciones de los artículos 14 y 15."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 2"
        apartado: "1"
        extracto: "Se excluyen los huertos familiares destinados exclusivamente a autoconsumo"
    revisada: true
  - id: A07
    conjunto: ajuste
    pregunta: "¿Puedo seguir echando urea sin más?"
    respuesta_esperada: "Hay que usar al menos un método de reducción, o llevar voluntariamente el cuaderno digital."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 12"
        apartado: "3"
        extracto: "Cuando se utilice urea o soluciones nitrogenadas ureicas deberá emplearse, al menos, uno de los métodos"
    revisada: true
  - id: A08
    conjunto: ajuste
    pregunta: "¿Me vale un programa de ordenador en lugar de un asesor de abonado?"
    respuesta_esperada: "Sí, si la comunidad autónoma lo dispone y se lleva cuaderno digital."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 20"
        apartado: null
        extracto: "emplea un programa informático de recomendaciones de abonado"
    revisada: true
  - id: A09
    conjunto: ajuste
    pregunta: "Si el fallo no tiene consecuencias, ¿me penalizan igual?"
    respuesta_esperada: "No, si las consecuencias son nulas o insignificantes."
    esperado:
      - norma: "RD 1049/2022"
        unidad: "artículo 15"
        apartado: "3"
        extracto: "no se aplicará penalización"
    revisada: true
  - id: A10
    conjunto: ajuste
    pregunta: "¿Puedo echar herbicida en el centro de la calle que tiene cubierta?"
    respuesta_esperada: "No, salvo excepciones justificadas."
    esperado:
      - norma: "RD 1048/2022"
        unidad: "artículo 42"
        apartado: "1.c"
        extracto: "No se permitirá el uso de herbicidas ni de otros fitosanitarios en el centro de la calle"
    revisada: true
  - id: A11
    conjunto: ajuste
    pregunta: "¿Desde cuándo se aplica el reglamento europeo del registro de tratamientos?"
    respuesta_esperada: "Desde el 1 de enero de 2026. Lo que se aplazó es pasar los registros al formato electrónico: los Estados pueden autorizar que no se haga con los usos anteriores a 2027 (Reglamento (UE) 2025/2203), y en España se puede llevar en papel hasta el 31 de diciembre de 2026 (RD 1311/2012, art. 16.1)."
    esperado:
      - norma: "Reglamento (UE) 2023/564"
        unidad: "artículo 5"
        apartado: null
        extracto: "Será aplicable a partir del 1 de enero de 2026"
    revisada: true
  - id: A12
    conjunto: ajuste
    pregunta: "¿Cuántos años guardo el libro de gestión de estiércoles en zona vulnerable?"
    respuesta_esperada: "Al menos cinco años."
    esperado:
      - norma: "Decreto 80/2025"
        unidad: "anexo I"
        apartado: "5.2.2"
        extracto: "los cinco años siguientes a la última anotación"
    revisada: true
  - id: A13
    conjunto: ajuste
    pregunta: "¿Qué día empieza la vendimia este año?"
    respuesta_esperada: "No es normativa."
    esperado: []
    revisada: true
  - id: A14
    conjunto: ajuste
    pregunta: "¿Qué abono le echo al almendro?"
    respuesta_esperada: "Fuera de ámbito: no recomienda productos ni dosis."
    esperado: []
    revisada: true
  - id: A15
    conjunto: ajuste
    pregunta: "¿Cuánto vale una hectárea de regadío?"
    respuesta_esperada: "No es normativa."
    esperado: []
    revisada: true
  - id: F01
    conjunto: final
    pregunta: "¿Cuántos metros tengo que dejar sin tratar al lado de un pozo del que se bebe?"
    respuesta_esperada: "Al menos 50 metros."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 33"
        apartado: "b"
        extracto: "una distancia de 50 metros sin tratar"
    revisada: true
  - id: F02
    conjunto: final
    pregunta: "Me ha sobrado caldo al terminar de tratar, ¿lo puedo tirar en la linde?"
    respuesta_esperada: "No. Se aplica en la misma parcela tratada, diluido para no pasar de la dosis máxima admisible; si hay instalaciones preparadas para eliminar restos, tienen preferencia."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 39"
        apartado: "a"
        extracto: "Se prohíbe el vertido de los restos de mezcla excedentes del tratamiento. Su eliminación se realizará aplicándolos en la misma parcela tratada previa su dilución con la cantidad de agua suficiente para que no se exceda la dosis máxima admisible"
    revisada: true
  - id: F03
    conjunto: final
    pregunta: "¿Cuántos años vale el carné de aplicador?"
    respuesta_esperada: "Diez años."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 20"
        apartado: "2"
        extracto: "tendrán una validez de 10 años"
    revisada: true
  - id: F04
    conjunto: final
    pregunta: "¿Cuántas veces hay que enjuagar una garrafa cuando se vacía?"
    respuesta_esperada: "Tres veces a mano, o con un dispositivo de presión, y el agua va al depósito."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 41"
        apartado: "1"
        extracto: "será enjuagado manualmente 3 veces"
    revisada: true
  - id: F05
    conjunto: final
    pregunta: "¿Cuándo puede volver a entrar la cuadrilla a la viña después de tratar?"
    respuesta_esperada: "Cuando se haya secado el cultivo, sin perjuicio del plazo de reentrada de la etiqueta."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 35"
        apartado: "1"
        extracto: "no se procederá a la reentrada en los cultivos tratados hasta que se hayan secado las partes del cultivo"
    revisada: true
  - id: F06
    conjunto: final
    pregunta: "Voy a tratar con gente contratada que me ayuda, ¿qué nivel de carné necesito?"
    respuesta_esperada: "El cualificado."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 18"
        apartado: "1.b"
        extracto: "para los agricultores que realicen tratamientos empleando personal auxiliar"
    revisada: true
  - id: F07
    conjunto: final
    pregunta: "¿Puedo meter la manguera en el pozo para llenar el tanque?"
    respuesta_esperada: "No, salvo con dispositivo antirretorno o con la captación más alta que la boca de llenado."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 32"
        apartado: "a"
        extracto: "No llenar los depósitos de los equipos de aplicación directamente desde los pozos"
    revisada: true
  - id: F08
    conjunto: final
    pregunta: "¿A cuántos metros del arroyo puedo preparar la mezcla?"
    respuesta_esperada: "Como mínimo 25 metros para mezclar y cargar, o 10 metros si el equipo lleva mezclador-incorporador."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 36"
        apartado: "d"
        extracto: "en ningún caso a menos de 25 metros de las mismas, o a distancia inferior a 10 metros cuando se utilicen equipos dotados de mezcladores-incorporadores de producto"
    revisada: true
  - id: F09
    conjunto: final
    pregunta: "Soy ingeniero agrónomo y la finca es mía, ¿puedo hacerme yo el asesoramiento de plagas?"
    respuesta_esperada: "Sí, si acredita la condición de asesor."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 11"
        apartado: "3"
        extracto: "podrá realizar el asesoramiento para dicha explotación"
    revisada: true
  - id: F10
    conjunto: final
    pregunta: "¿Hay que poner un cartel en el invernadero después de fumigar?"
    respuesta_esperada: "Sí, salvo con productos de bajo riesgo."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 35"
        apartado: "3"
        extracto: "se indicará en un cartel visible a la entrada del recinto"
    revisada: true
  - id: F11
    conjunto: final
    pregunta: "¿Tengo que guardar las facturas de los productos que compro?"
    respuesta_esperada: "Sí, junto con el registro, al menos los 3 años siguientes a su emisión."
    esperado:
      - norma: "RD 1311/2012"
        unidad: "artículo 16"
        apartado: "3"
        extracto: "las facturas y los demás documentos justificativos"
    revisada: true
  - id: F12
    conjunto: final
    pregunta: "¿Puedo pasar lo que queda de una garrafa a una botella más pequeña?"
    respuesta_esperada: "No: se queda en su envase, cerrado y con la etiqueta."
    esperado:
      - norma: "RD 285/2021"
        unidad: "artículo 7"
        apartado: "a"
        extracto: "el resto deberá mantenerse en el mismo envase"
    revisada: true
  - id: F13
    conjunto: final
    pregunta: "¿Puedo comprar por internet un herbicida de uso profesional?"
    respuesta_esperada: "No."
    esperado:
      - norma: "RD 285/2021"
        unidad: "artículo 14"
        apartado: "1"
        extracto: "La venta a distancia solo podrá realizarse para productos de uso no profesional"
    revisada: true
  - id: F14
    conjunto: final
    pregunta: "¿Tiene que tener cerradura el armario donde guardo los fitosanitarios?"
    respuesta_esperada: "Sí, y ventilación."
    esperado:
      - norma: "RD 285/2021"
        unidad: "artículo 7"
        apartado: "b"
        extracto: "ventilados y provistos de cerradura"
    revisada: true
  - id: F15
    conjunto: final
    pregunta: "Toda mi tierra son 8 hectáreas de secano, ¿me libro de hacer plan de abonado?"
    respuesta_esperada: "Sí: no están obligadas las unidades de producción de secano que no superen las 10 hectáreas."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 4"
        apartado: "2.b"
        extracto: "Las que no superen las 10 hectáreas de superficie, si son de secano"
    revisada: true
  - id: F16
    conjunto: final
    pregunta: "¿Cuánto tiempo tengo para apuntar que he abonado?"
    respuesta_esperada: "Un mes."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 4"
        apartado: "1"
        extracto: "en un plazo no superior a un mes desde la fecha"
    revisada: true
  - id: F17
    conjunto: final
    pregunta: "¿Puedo echar abono con el campo nevado?"
    respuesta_esperada: "No."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 4"
        apartado: "4.a"
        extracto: "En terrenos helados o cubiertos de nieve"
      - norma: "Decreto 80/2025"
        unidad: "anexo I"
        apartado: "4.3.1"
        extracto: "En terrenos helados o cubiertos de nieve"
    revisada: true
  - id: F18
    conjunto: final
    pregunta: "He echado estiércol en el pasto, ¿cuántos días espero para meter las ovejas?"
    respuesta_esperada: "Al menos 21 días."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 13"
        apartado: "3"
        extracto: "un mínimo de 21 días antes de que el ganado pueda entrar a pastar"
    revisada: true
  - id: F19
    conjunto: final
    pregunta: "¿Se puede esparcir purín con cañón?"
    respuesta_esperada: "No, salvo las excepciones del propio artículo."
    esperado:
      - norma: "RD 1051/2022"
        unidad: "artículo 10"
        apartado: "1"
        extracto: "Se prohíbe la aplicación de purines mediante sistemas de plato, abanico y por cañón"
    revisada: true
  - id: F20
    conjunto: final
    pregunta: "Si pongo algo falso en el cuaderno digital, ¿quién responde?"
    respuesta_esperada: "El titular de la explotación."
    esperado:
      - norma: "RD 1054/2022"
        unidad: "artículo 9"
        apartado: "2"
        extracto: "son los responsables de la veracidad de los datos"
    revisada: true
  - id: F21
    conjunto: final
    pregunta: "¿Cada cuánto llegan al Ministerio los datos del cuaderno digital?"
    respuesta_esperada: "Al menos dos veces al año."
    esperado:
      - norma: "RD 1054/2022"
        unidad: "artículo 9"
        apartado: "2"
        extracto: "se actualizará al menos dos veces al año"
    revisada: true
  - id: F22
    conjunto: final
    pregunta: "Solo tengo 9 hectáreas, ¿me pueden bajar la ayuda por la condicionalidad?"
    respuesta_esperada: "No: no se penaliza si toda la superficie agraria declarada de la explotación es de 10 hectáreas o menos. No es un tramo exento para las que son mayores."
    esperado:
      - norma: "RD 1049/2022"
        unidad: "artículo 14"
        apartado: "1"
        extracto: "no se aplicarán penalizaciones a las personas beneficiarias cuya explotación sea igual o inferior a las 10 hectáreas de superficie agraria declarada"
    revisada: true
  - id: F23
    conjunto: final
    pregunta: "Si repito el mismo fallo sin querer, ¿cuánto me quitan de la PAC?"
    respuesta_esperada: "Por norma general, el 10 % si se repite una vez en tres años seguidos."
    esperado:
      - norma: "RD 1049/2022"
        unidad: "artículo 15"
        apartado: "7"
        extracto: "el porcentaje de reducción de las ayudas será, por norma general, del 10 %"
    revisada: true
  - id: F24
    conjunto: final
    pregunta: "¿Cuántos meses tiene que estar viva la hierba entre las olivas para cobrar el ecorrégimen?"
    respuesta_esperada: "Cuatro meses como mínimo, entre el 1 de octubre y el 31 de marzo."
    esperado:
      - norma: "RD 1048/2022"
        unidad: "artículo 42"
        apartado: "1.b"
        extracto: "durante un periodo mínimo de cuatro meses"
    revisada: true
  - id: F25
    conjunto: final
    pregunta: "¿Hasta qué día puedo picar los sarmientos para el ecorrégimen?"
    respuesta_esperada: "Hasta el 15 de abril, salvo que la comunidad autónoma lo adapte."
    esperado:
      - norma: "RD 1048/2022"
        unidad: "artículo 43"
        apartado: "1.a"
