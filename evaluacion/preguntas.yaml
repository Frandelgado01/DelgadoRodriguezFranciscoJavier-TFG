# Preguntas de referencia de la evaluación del RAG (REQ-43; T-112). Redactadas por el agente el 2026-11-25 a partir de la norma;
# el alumno las revisa y pone `revisada: true` (evaluacion/revision.md). Las de ajuste sirven para mejorar el sistema; las finales se
# miden una sola vez (T-137). `extracto` es texto literal de la norma vigente, comprobado al generarlas.
normas:
  "RD 1311/2012": BOE-A-2012-11605
  "RD 285/2021": BOE-A-2021-7689
  "RD 1048/2022": BOE-A-2022-23048
  "RD 1049/2022": BOE-A-2022-23049
  "RD 1051/2022": BOE-A-2022-23052
  "RD 1054/2022": BOE-A-2022-23054
  "Reglamento (UE) 2023/564": DOUE-L-2023-80367
