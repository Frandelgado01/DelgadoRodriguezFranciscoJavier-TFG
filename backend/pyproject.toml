[project]
name = "cuaderno"
version = "0.1.0"
description = "API del Cuaderno de Campo digital (TFG UCLM)"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.14.1",
    "sqlmodel==0.0.48",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Selección explícita (documentación de Ruff: "Prefer lint.select over lint.extend-select").
# S = flake8-bandit, reglas de seguridad (R13; principio VI).
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest usa assert para las comprobaciones (S101 "Use of assert detected").
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
# La carpeta backend/alembic (migraciones) no es el paquete alembic.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
files = ["src/cuaderno"]
